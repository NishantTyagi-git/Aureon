<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aureon — Commodity Derivatives Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='none' stroke='%23d6ad5c' stroke-width='2'/%3E%3Cpath d='M7 15l3-4 3 2 4-6' fill='none' stroke='%23d6ad5c' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script>
    try { const t = localStorage.getItem("aureon.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="nav">
    <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/home" aria-label="Aureon home">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="var(--c-goldm)" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M6.5 15.5l3.5-4.5 3 2.2 4.5-6"/></svg>
      <span class="brand-name">Aureon</span>
      <span class="brand-sub">MCX gold research</span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Main"></nav>
    <div class="nav-right">
      <span class="data-pill" id="data-pill"><span class="dot"></span><span>—</span></span>
      <button class="search-trigger" id="search-trigger" aria-label="Search pages, pairs and terms">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="lbl">Search</span><span class="kbd">Ctrl K</span>
      </button>
      <button class="icon-btn" id="help-btn" aria-label="Open glossary" title="Glossary — what the terms mean">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Switch light or dark theme" title="Light / dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main class="main" id="view" tabindex="-1"></main>
  <div class="palette-backdrop" id="palette"><div class="palette" role="dialog" aria-label="Search"><input id="palette-input" placeholder="Search pages, contract pairs or terms…" autocomplete="off" /><div class="items" id="palette-items" role="listbox"></div></div></div>
  <div class="drawer-backdrop" id="glossary" role="dialog" aria-label="Glossary"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
